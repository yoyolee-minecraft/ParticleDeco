name: build
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build and run gametests
        run: chmod +x ./gradlew && ./gradlew --no-daemon build runGameTest --stacktrace
      - name: show gametest report
        if: always()
        run: cat build/gametest-junit.xml 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
