# Dev helper: print javap signatures of Minecraft classes from the Loom-provided jar.
# Used because the development sandbox cannot reach Mojang/Fabric hosts directly.
name: api-probe
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Space separated class names for javap -p"
        required: false
        default: ""
      list:
        description: "Regex for listing class names inside the jar"
        required: false
        default: ""
      constants:
        description: "Space separated class names for javap -p -constants -c (full bytecode)"
        required: false
        default: ""
      lang:
        description: "Space separated item ids; prints their official zh_tw names"
        required: false
        default: ""
      version:
        description: "Minecraft version for the lang lookup"
        required: false
        default: "26.2"

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: zh_tw names
        if: ${{ inputs.lang != '' }}
        env:
          LANG_IDS: ${{ inputs.lang }}
          MC_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          get = lambda u: json.load(urllib.request.urlopen(u))
          manifest = get("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          version = next(v for v in manifest["versions"] if v["id"] == os.environ["MC_VERSION"])
          index = get(get(version["url"])["assetIndex"]["url"])
          h = index["objects"]["minecraft/lang/zh_tw.json"]["hash"]
          lang = get(f"https://resources.download.minecraft.net/{h[:2]}/{h}")
          print("##### LANG")
          for raw in os.environ["LANG_IDS"].split():
              ns, _, path = raw.partition(":") if ":" in raw else ("minecraft", "", raw)
              name = lang.get(f"item.{ns}.{path}") or lang.get(f"block.{ns}.{path}") or lang.get(raw) or "?"
              print(f"{raw}\t{name}")
          print("##### END LANG")
          PY
      - name: setup loom
        if: ${{ inputs.lang == '' }}
        run: chmod +x ./gradlew && ./gradlew --no-daemon help -q
      - name: probe
        if: ${{ inputs.lang == '' }}
        env:
          CLASSES: ${{ inputs.classes }}
          LIST: ${{ inputs.list }}
          CONSTANTS: ${{ inputs.constants }}
        run: |
          JARS=$(find ~/.gradle .gradle -name 'minecraft-*.jar' -not -name '*sources*' 2>/dev/null | sort)
          echo "$JARS"
          CP=$(echo "$JARS" | tr '\n' ':')
          MC=$(echo "$JARS" | grep 'minecraft-merged-deobf' | head -1)
          [ -z "$MC" ] && MC=$(echo "$JARS" | grep merged | head -1)
          echo "Using $MC"
          if [ -n "$LIST" ]; then echo "##### LIST"; unzip -Z1 "$MC" | grep -E "$LIST" | grep -v '\$' | sed 's/\.class$//' || true; fi
          for c in $CLASSES; do echo "##### $c"; javap -p -cp "$CP" "$c" 2>&1 | grep -v 'lambda\$' || true; done
          for c in $CONSTANTS; do echo "##### BYTECODE $c"; javap -p -c -constants -cp "$CP" "$c" 2>&1 || true; done
          echo "##### END"
