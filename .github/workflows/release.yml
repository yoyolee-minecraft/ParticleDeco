name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build and run gametests
        run: chmod +x ./gradlew && ./gradlew --no-daemon build runGameTest
      - name: collect jar
        run: |
          mkdir dist
          cp build/libs/particledeco-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist
          sha256sum dist/*.jar > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Particle Deco ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
